
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tammy Cars Kenya</title>
<link rel="stylesheet" href="/static/style.css">
</head>

<body>

<header>
  <h1>Tammy Cars Kenya</h1>
  <p>Kenya vehicle search</p>
  <a class="paylink" href="/payment">Make a payment</a>
</header>

<main>

  <div class="search">
    <input id="q" placeholder="Make or model">

    <select id="county">
      <option value="">All counties</option>
      <option>Nairobi</option>
      <option>Kiambu</option>
      <option>Mombasa</option>
      <option>Nakuru</option>
      <option>Kisumu</option>
      <option>Kakamega</option>
    </select>

    <input id="max" type="number" placeholder="Max price">

    <button onclick="load()">Search</button>
  </div>

  <div id="cars" class="grid"></div>

</main>

<script>

function e(x){
  return String(x ?? "").replace(/[&<>"']/g,m=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[m]));
}

async function load(){

  let p = new URLSearchParams({
    q:q.value,
    county:county.value,
    max_price:max.value
  });

  let a = await (await fetch("/api/vehicles?"+p)).json();

  cars.innerHTML = a.map(v => `

    <article>

      <img
        src="${e(v.image_url || "")}"
        onerror="this.style.display='none'"
      >

      <div>

        <h2>${e(v.title)}</h2>

        <b>
          KSh ${Number(v.price || 0).toLocaleString()}
        </b>

        <p>
          ${e(v.year || "")}
          •
          ${e(v.mileage || "")} km
          •
          ${e(v.county || "Kenya")}
        </p>

        <small>
          Source: ${e(v.source || "")}
        </small>

        <p>
          Seller contact and exact location hidden.
        </p>

      </div>

    </article>

  `).join("") || "<p>No vehicles found.</p>";
}

load();

</script>

</body>
</html>
