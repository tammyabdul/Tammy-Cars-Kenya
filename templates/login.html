<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Login - Tammy Cars Kenya</title>
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<header>
  <h1>Tammy Cars Kenya</h1>
  <p>Administrator Login</p>
</header>

<main>
  <section class="panel">

    <h2>Admin Login</h2>

    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}

    <form method="post" action="/login">

      <label>Username</label>
      <input
        type="text"
        name="username"
        required
      >

      <label>Password</label>
      <input
        type="password"
        name="password"
        required
      >

      <button type="submit">Login</button>

    </form>

  </section>
</main>

</body>
</html>
